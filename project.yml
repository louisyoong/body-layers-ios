name: HumanAtlas
options:
  bundleIdPrefix: com.louisyoong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "M9VG7M352C"
    CODE_SIGN_STYLE: Automatic
targets:
  HumanAtlas:
    type: application
    platform: iOS
    sources:
      - path: HumanAtlas
    resources:
      - path: HumanAtlas/Resources
      - path: HumanAtlas/Assets.xcassets
    info:
      path: HumanAtlas/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # All orientations and no UIRequiresFullScreen, so the app re-lays out and
        # rotates with the device (iPhone Duo scales full-screen-only apps instead).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: "Body Layers"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisyoong.humanatlas
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
  HumanAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HumanAtlasUITests
    dependencies:
      - target: HumanAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louisyoong.humanatlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HumanAtlas
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  HumanAtlas:
    build:
      targets:
        HumanAtlas: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HumanAtlasUITests
    archive:
      config: Release
